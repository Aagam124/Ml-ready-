# One command: docker compose up --build      (web UI on http://localhost:8080, API docs on http://localhost:8000/docs)
x-backend: &backend
  build: ./backend
  environment: &env
    MLREADY_MONGO_URI: mongodb://mongo:27017
    MLREADY_ENV: ${MLREADY_ENV:-development}
    MLREADY_JWT_SECRET: ${MLREADY_JWT_SECRET:-dev-only-change-me}   # REQUIRED to change when MLREADY_ENV=production
    MLREADY_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
  depends_on:
    mongo: { condition: service_healthy }

services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    <<: *backend
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *backend
    command: ["python", "-m", "app.jobs.worker"]
    stop_grace_period: 120s          # lets a running job finish after SIGTERM
    deploy: { replicas: 1 }          # scale with: docker compose up --scale worker=3

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  mongo_data:
