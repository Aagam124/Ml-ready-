services:
  # 1. MLReady Backend Web Service (FastAPI + Background Worker)
  - type: web
    name: mlready-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: MLREADY_ENV
        value: production
      - key: MLREADY_JWT_SECRET
        generateValue: true
      - key: MLREADY_MONGO_URI
        sync: false # Provide your MongoDB Atlas connection string
      - key: PYTHON_VERSION
        value: 3.12.0

  # 2. MLReady Frontend Static Site (React + Vite)
  - type: static
    name: mlready-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mlready-api
          property: host
